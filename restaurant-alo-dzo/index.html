<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà hàng Ấm Thực Alo Dzo 100 - Vĩnh Long</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="font-sans">
    <!-- Header Component -->
    <div id="header-component"></div>

    <!-- Banner Component -->
    <div id="banner-component"></div>

    <!-- Featured Dishes Section -->
    <section class="featured-dishes py-16">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12">Món Ăn Nổi Bật</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Featured dishes will be added here -->
            </div>
        </div>
    </section>

    <!-- About Preview Section -->
    <section class="about-preview bg-gray-100 py-16">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                <div class="about-image">
                    <img src="assets/images/restaurant.jpg" alt="Nhà hàng Alo Dzo 100" class="rounded-lg shadow-lg">
                </div>
                <div class="about-content">
                    <h2 class="text-3xl font-bold mb-6">Về Chúng Tôi</h2>
                    <p class="text-gray-600 mb-6">
                        Nhà hàng Ấm Thực Alo Dzo 100 tự hào là điểm đến ẩm thực hàng đầu tại Vĩnh Long, 
                        mang đến cho quý khách những trải nghiệm ẩm thực độc đáo với không gian sang trọng 
                        và dịch vụ chuyên nghiệp.
                    </p>
                    <a href="about.html" class="text-red-600 hover:text-red-700 font-semibold">
                        Tìm hiểu thêm <i class="fas fa-arrow-right ml-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Chatbot Component -->
    <div id="chatbot-component"></div>

    <!-- Footer Component -->
    <div id="footer-component"></div>

    <!-- JavaScript -->
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>

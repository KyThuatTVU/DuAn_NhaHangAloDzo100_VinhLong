<!-- Top Bar -->
<div class="bg-brand-primary text-white py-2 text-sm">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <span><i class="fas fa-phone mr-1"></i> 0123-456-789</span>
                <span><i class="fas fa-envelope mr-1"></i> info@amthucphuongnam.com</span>
            </div>
            <div class="flex items-center space-x-2">
                <span>Miễn phí giao hàng cho đơn từ 200k</span>
                <i class="fas fa-shipping-fast"></i>
            </div>
        </div>
    </div>
</div>

<!-- Header -->
<header class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between py-4">
            <!-- Logo -->
            <div class="flex items-center">
                <div class="w-12 h-12 bg-brand-primary rounded-full flex items-center justify-center mr-3">
                    <i class="fas fa-utensils text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold brand-primary">Ẩm Thực Phương Nam</h1>
                    <p class="text-sm text-gray-600">Đặc sản miền Nam</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl mx-8">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Tìm kiếm món ăn, combo, thức uống..."
                        class="w-full py-3 pl-4 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:border-brand-primary"
                    >
                    <button class="absolute right-3 top-1/2 transform -translate-y-1/2">
                        <i class="fas fa-search text-gray-400"></i>
                    </button>
                    <!-- Search Suggestions -->
                    <div id="searchSuggestions" class="absolute top-full left-0 right-0 bg-white border border-gray-200 rounded-lg shadow-lg mt-1 hidden">
                        <div class="p-2">
                            <div class="text-xs text-gray-500 mb-2">Gợi ý tìm kiếm:</div>
                            <div class="space-y-1">
                                <div class="p-2 hover:bg-gray-100 cursor-pointer rounded">Bánh xèo miền Tây</div>
                                <div class="p-2 hover:bg-gray-100 cursor-pointer rounded">Cơm tấm sườn nướng</div>
                                <div class="p-2 hover:bg-gray-100 cursor-pointer rounded">Hủ tiếu Nam Vang</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Menu -->
            <div class="flex items-center space-x-4">
                <button onclick="toggleAuth()" class="flex items-center text-gray-700 hover:text-brand-primary">
                    <i class="fas fa-user mr-2"></i>
                    <span class="hidden md:block">Đăng nhập</span>
                </button>
                
                <button onclick="toggleCart()" class="relative flex items-center text-gray-700 hover:text-brand-primary">
                    <i class="fas fa-shopping-cart mr-2"></i>
                    <span class="hidden md:block">Giỏ hàng</span>
                    <span id="cartBadge" class="absolute -top-2 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </div>
</header>
